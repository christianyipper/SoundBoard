name: Update rosters

on:
  schedule:
    - cron: '0 9 * * *' # daily, ~3am Mountain
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-rosters
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: rosters
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: rosters/package-lock.json

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scrape.mjs

      - name: Commit rosters.json if changed
        run: |
          # updatedAt changes every run, so compare everything but that line.
          if git diff --quiet -I '"updatedAt"' -- rosters.json; then
            echo "No roster/stat changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rosters.json
          git commit -m "Update rosters $(date -u +%Y-%m-%d)"
          git pull --rebase
          git push
